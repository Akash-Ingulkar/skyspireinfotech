spring.application.name=admin-panel
server.port=8081

# Served at https://skyspireinfotech.com/admin (nginx proxies /admin/ to this app),
# and locally at http://localhost:8081/admin
server.servlet.context-path=/admin
# Trust nginx's X-Forwarded-* headers so redirects stay on https://skyspireinfotech.com
server.forward-headers-strategy=framework
# Keep the session id in the cookie only, never in URLs (;jsessionid=...)
server.servlet.session.tracking-modes=cookie

# Local defaults; on the VPS set DB_URL / DB_USERNAME / DB_PASSWORD in the service's environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skyspire_admin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# Hero videos go up to 50 MB (per-type limits are enforced in HomeContentController).
# nginx's client_max_body_size for /admin must be at least max-request-size.
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=60MB

# Where uploaded branding assets (logo, favicon) are stored on disk, served at /uploads/**.
app.upload-dir=uploads

# Seeded on first run if no admin user exists yet — change this immediately after first login.
admin.seed.username=admin
admin.seed.password=${ADMIN_SEED_PASSWORD:ChangeMe123!}
