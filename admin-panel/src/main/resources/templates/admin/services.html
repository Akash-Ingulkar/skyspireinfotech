<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
  <div class="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <header th:replace="~{fragments/layout :: header}"></header>

    <div class="page-wrapper">
      <div class="page-content">
        <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
          <div class="breadcrumb-title pe-3">Website</div>
          <div class="ps-3">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0 p-0">
                <li class="breadcrumb-item"><i class="bx bx-home-alt"></i></li>
                <li class="breadcrumb-item active" aria-current="page">Services</li>
              </ol>
            </nav>
          </div>
          <div class="ms-auto">
            <a th:href="@{/services/new}" class="btn btn-primary"><i class="bx bx-plus"></i> Add Service</a>
          </div>
        </div>

        <div class="alert alert-success d-flex align-items-center" th:if="${success}" th:text="${success}"></div>

        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="service : ${services}">
                    <td th:text="${service.displayOrder}"></td>
                    <td class="fw-semibold" th:text="${service.title}"></td>
                    <td class="text-truncate" style="max-width: 320px;" th:text="${service.description}"></td>
                    <td>
                      <span th:if="${service.active}" class="badge bg-success">Active</span>
                      <span th:unless="${service.active}" class="badge bg-secondary">Hidden</span>
                    </td>
                    <td class="text-end">
                      <a th:href="@{/services/{id}/edit(id=${service.id})}" class="btn btn-sm btn-icon btn-light" title="Edit">
                        <i class="bx bx-edit"></i>
                      </a>
                      <form th:action="@{/services/{id}/delete(id=${service.id})}" method="post" class="d-inline"
                            onsubmit="return confirm('Delete this service?');">
                        <button type="submit" class="btn btn-sm btn-icon btn-light text-danger" title="Delete">
                          <i class="bx bx-trash"></i>
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${services.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4">No services yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <footer class="page-footer">
        <p class="mb-0">&copy; 2026 Skyspire InfoTech Admin</p>
      </footer>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: switcher}"></div>
  <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
